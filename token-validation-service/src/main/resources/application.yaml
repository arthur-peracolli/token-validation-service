spring:
  application:
    name: token-validation-service

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always
      show-components: always
    prometheus:
      enabled: true

logging:
  level:
    com.challenge: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Configuração do JWT (lendo da variável de ambiente)
jwt:
  secret: ${JWT_SECRET}