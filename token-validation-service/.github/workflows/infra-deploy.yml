name: Infra CI/CD

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TF_WORKING_DIR: backend-challenge-infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build with Maven
        run: mvn -B -f ./pom.xml package -DskipTests

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform apply (bootstrap bucket and IAM)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false

      - name: Get artifact bucket
        working-directory: ${{ env.TF_WORKING_DIR }}
        id: bucket
        run: echo "ARTIFACT_BUCKET=$(terraform output -raw artifact_bucket)" >> $GITHUB_ENV

      - name: Upload artifact to S3
        run: |
          ARTIFACT=$(ls ../target/*.jar | head -n1)
          KEY=${{ github.sha }}-${{ github.run_number }}.jar
          aws s3 cp "$ARTIFACT" "s3://$ARTIFACT_BUCKET/$KEY"
          echo "S3_KEY=$KEY" >> $GITHUB_ENV

      - name: Get ECR repository URL
        working-directory: ${{ env.TF_WORKING_DIR }}
        id: ecr
        run: echo "ECR_REPO=$(terraform output -raw ecr_repository_url)" >> $GITHUB_ENV

      - name: Build and push Docker image to ECR
        env:
          ECR_REPO: ${{ env.ECR_REPO }}
        run: |
          IMAGE_TAG=${{ github.sha }}
          echo "Building image $ECR_REPO:$IMAGE_TAG"
          docker build -t $ECR_REPO:$IMAGE_TAG ..
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REPO
          docker push $ECR_REPO:$IMAGE_TAG
          echo "IMAGE_URI=$ECR_REPO:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Terraform apply (create lambda & api)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve -input=false \
            -var "s3_key=${{ env.S3_KEY }}" \
            -var "image_uri=${{ env.IMAGE_URI }}"

      - name: Get API URL
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: echo "API_URL=$(terraform output -raw api_url)" >> $GITHUB_ENV

      - name: Output API URL
        run: echo "API available at ${{ env.API_URL }}"

